<section class="bg-slate-50 dark:bg-[#0a0a0c] text-slate-900 dark:text-white w-full h-screen overflow-hidden relative select-none antialiased flex flex-col items-center justify-center m-0 p-0">
  <!-- Background Ambient Glow & Grid -->
  <div class="absolute inset-0 bg-grid-pattern pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[520px] h-[520px] bg-gradient-to-tr from-[color-mix(in_srgb,var(--accent)_25%,transparent)] to-[color-mix(in_srgb,var(--accent-deep)_15%,transparent)] rounded-full glow-aura pointer-events-none"></div>

  <!-- Central Hero Experience -->
  <main class="relative z-10 flex flex-col items-center justify-center px-6 text-center w-full">
    <!-- Concentric animated sound rings -->
    <div class="relative w-44 h-44 mb-8 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border border-[color-mix(in_srgb,var(--accent)_30%,transparent)] ripple-ring pointer-events-none"></div>
      <div class="absolute inset-0 rounded-full border border-[color-mix(in_srgb,var(--accent)_20%,transparent)] ripple-ring-delayed pointer-events-none"></div>

      <!-- Logo Container with Glassmorphism and Neon Glow -->
      <div class="relative w-32 h-32 rounded-3xl bg-white/80 dark:bg-[#131316]/80 backdrop-blur-2xl border border-slate-200 dark:border-white/10 shadow-xl dark:shadow-[0_0_50px_color-mix(in_srgb,var(--accent)_35%,transparent)] flex items-center justify-center group hover:scale-105 transition-all duration-300">
        <!-- Sound Wave Icon Graphic (Animated Bars) -->
        <div class="flex items-end justify-center gap-1.5 h-14">
          <span class="w-2 h-8 bg-gradient-to-t from-[var(--accent-deep)] to-[var(--accent)] rounded-full wave-bar-1 dark:shadow-[0_0_8px_var(--accent)]"></span>
          <span class="w-2 h-12 bg-gradient-to-t from-[var(--accent-deep)] to-[var(--accent)] rounded-full wave-bar-2 dark:shadow-[0_0_12px_var(--accent)]"></span>
          <span class="w-2 h-14 bg-gradient-to-t from-[var(--accent-deep)] to-[var(--accent)] rounded-full wave-bar-3 dark:shadow-[0_0_16px_var(--accent)]"></span>
          <span class="w-2 h-10 bg-gradient-to-t from-[var(--accent-deep)] to-[var(--accent)] rounded-full wave-bar-4 dark:shadow-[0_0_12px_var(--accent)]"></span>
          <span class="w-2 h-6 bg-gradient-to-t from-[var(--accent-deep)] to-[var(--accent)] rounded-full wave-bar-5 dark:shadow-[0_0_8px_var(--accent)]"></span>
        </div>
      </div>
    </div>

    <!-- Brand Typography & Subtitle -->
    <div class="animate-float-in max-w-xl">
      <h1 class="text-6xl md:text-7xl font-black tracking-tight mb-2 text-slate-900 dark:text-white flex items-center justify-center gap-3">
        Sound
        <span class="text-xs align-top uppercase px-2.5 py-0.5 rounded-full bg-[color-mix(in_srgb,var(--accent)_15%,transparent)] text-[var(--accent-ink)] dark:text-[var(--accent)] border border-[color-mix(in_srgb,var(--accent)_30%,transparent)] font-semibold tracking-wider">v2.4</span>
      </h1>

      <p class="text-sm md:text-base font-bold tracking-[0.25em] text-[var(--accent-ink)] dark:text-[var(--accent)] uppercase mb-4 dark:drop-shadow-[0_0_12px_color-mix(in_srgb,var(--accent)_40%,transparent)]">
        {{ 'common.brandTagline' | translate }}
      </p>

      <p class="text-slate-600 dark:text-neutral-400 text-base md:text-lg max-w-md mx-auto leading-relaxed mb-8">
        {{ 'welcome.app.description' | translate }}
      </p>
    </div>
  </main>
</section>
