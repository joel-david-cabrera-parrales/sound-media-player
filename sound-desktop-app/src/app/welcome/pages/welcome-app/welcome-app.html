<section class="bg-[#0a0a0c] text-white w-full h-screen overflow-hidden relative select-none antialiased flex flex-col items-center justify-center m-0 p-0">
  <!-- Background Ambient Glow & Grid -->
  <div class="absolute inset-0 bg-grid-pattern pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[520px] h-[520px] bg-gradient-to-tr from-[#00d2ff]/25 to-[#0088cc]/15 rounded-full glow-aura pointer-events-none"></div>

  <!-- Central Hero Experience -->
  <main class="relative z-10 flex flex-col items-center justify-center px-6 text-center w-full">
    <!-- Concentric animated sound rings -->
    <div class="relative w-44 h-44 mb-8 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border border-[#00d2ff]/30 ripple-ring pointer-events-none"></div>
      <div class="absolute inset-0 rounded-full border border-[#00d2ff]/20 ripple-ring-delayed pointer-events-none"></div>

      <!-- Logo Container with Glassmorphism and Neon Glow -->
      <div class="relative w-32 h-32 rounded-3xl bg-[#131316]/80 backdrop-blur-2xl border border-white/10 shadow-[0_0_50px_rgba(0,210,255,0.35)] flex items-center justify-center group hover:scale-105 transition-all duration-300">
        <!-- Sound Wave Icon Graphic (Animated Bars) -->
        <div class="flex items-end justify-center gap-1.5 h-14">
          <span class="w-2 h-8 bg-gradient-to-t from-[#0088cc] to-[#00d2ff] rounded-full wave-bar-1 shadow-[0_0_8px_#00d2ff]"></span>
          <span class="w-2 h-12 bg-gradient-to-t from-[#0088cc] to-[#00d2ff] rounded-full wave-bar-2 shadow-[0_0_12px_#00d2ff]"></span>
          <span class="w-2 h-14 bg-gradient-to-t from-[#0088cc] to-[#00d2ff] rounded-full wave-bar-3 shadow-[0_0_16px_#00d2ff]"></span>
          <span class="w-2 h-10 bg-gradient-to-t from-[#0088cc] to-[#00d2ff] rounded-full wave-bar-4 shadow-[0_0_12px_#00d2ff]"></span>
          <span class="w-2 h-6 bg-gradient-to-t from-[#0088cc] to-[#00d2ff] rounded-full wave-bar-5 shadow-[0_0_8px_#00d2ff]"></span>
        </div>
      </div>
    </div>

    <!-- Brand Typography & Subtitle -->
    <div class="animate-float-in max-w-xl">
      <h1 class="text-6xl md:text-7xl font-black tracking-tight mb-2 text-white flex items-center justify-center gap-3">
        Sound
        <span class="text-xs align-top uppercase px-2.5 py-0.5 rounded-full bg-[#00d2ff]/15 text-[#00d2ff] border border-[#00d2ff]/30 font-semibold tracking-wider">v2.4</span>
      </h1>

      <p class="text-sm md:text-base font-bold tracking-[0.25em] text-[#00d2ff] uppercase mb-4 drop-shadow-[0_0_12px_rgba(0,210,255,0.4)]">
        High-Fidelity Audio
      </p>

      <p class="text-neutral-400 text-base md:text-lg max-w-md mx-auto leading-relaxed mb-8">
        La nueva era del streaming musical y bibliotecas locales de alta resolución. Sonido puro sin pérdida.
      </p>
    </div>
  </main>
</section>
