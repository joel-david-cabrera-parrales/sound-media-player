<div
  class="group relative p-3.5 rounded-xl bg-white dark:bg-[#181818] hover:bg-slate-100 dark:hover:bg-[#242424]/90 transition-all duration-200 border flex flex-col gap-3 cursor-pointer shadow-sm dark:shadow-none"
  [class]="isCurrent() ? 'border-[color-mix(in_srgb,var(--accent)_40%,transparent)]' : 'border-slate-200 dark:border-white/[0.08]'"
  (click)="playTrack.emit(track())"
  (keydown.enter)="playTrack.emit(track())"
  (keydown.space)="playTrack.emit(track()); $event.preventDefault()"
  tabindex="0"
  role="button"
  [attr.aria-label]="track().title"
>
  <div class="relative aspect-square w-full rounded-lg overflow-hidden bg-slate-100 dark:bg-[#242424] shadow-md">
    <shared-track-cover
      [track]="track()"
      [klass]="'w-full h-full object-cover'"
      [width]="'100%'"
      [height]="'100%'"
    />
    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
      <shared-play-button
        [isCurrent]="isCurrent()"
        [title]="'shell.dock.play' | translate"
        [klass]="'w-12 h-12'"
        [size]="'md'"
        (playClick)="onPlay()"
      />
    </div>
    @if (isCurrent()) {
      <div class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-[#0e0e0e]/90 backdrop-blur-md border border-[color-mix(in_srgb,var(--accent)_40%,transparent)] flex items-center gap-1.5 shadow">
        <span class="flex items-end gap-0.5 h-3">
          <span class="w-0.5 bg-[var(--accent)] rounded-full eq-bar-1"></span>
          <span class="w-0.5 bg-[var(--accent)] rounded-full eq-bar-2"></span>
          <span class="w-0.5 bg-[var(--accent)] rounded-full eq-bar-3"></span>
        </span>
        <span class="text-[10px] font-bold text-[var(--accent)] uppercase tracking-wider">{{ 'library.playing' | translate }}</span>
      </div>
    }
    <shared-favorite-button
      [liked]="isLiked()"
      [label]="'shell.dock.favorite' | translate"
      [buttonClass]="'absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center transition-all active:scale-95'"
      [idleClass]="isLiked() ? '' : 'opacity-0 group-hover:opacity-100 text-white/80 hover:text-[var(--accent)]'"
      [iconClass]="'text-[18px]'"
      (toggled)="onToggleLike()"
    />
  </div>
  <div class="flex flex-col gap-1 min-w-0">
    <div class="flex items-center gap-1 min-w-0">
      <span class="font-bold text-[16px] leading-[22px] truncate cursor-pointer hover:underline flex-1 min-w-0"
        [class]="isCurrent() ? 'text-[var(--accent-ink)] dark:text-[var(--accent)]' : 'text-slate-900 dark:text-white'"
      >
        {{ track().title }}
      </span>
      <button
        type="button"
        (click)="onOpenMenu($event)"
        [title]="'trackMenu.open' | translate"
        class="p-0.5 rounded text-slate-400 dark:text-[#6a6a6a] hover:text-slate-900 dark:hover:text-white opacity-0 group-hover:opacity-100 focus-visible:opacity-100 group-focus-within:opacity-100 transition-all flex-shrink-0"
      >
        <span class="material-symbols-outlined text-[18px]">more_vert</span>
      </button>
    </div>
    <span class="text-[12px] leading-[16px] text-slate-500 dark:text-[#b3b3b3] truncate">{{ track().artist }}</span>
    <span class="text-[11px] leading-[14px] font-mono text-[var(--accent-ink)] dark:text-[var(--accent)]">
      {{ formatDuration(track().durationSec) }}
    </span>
  </div>
</div>
