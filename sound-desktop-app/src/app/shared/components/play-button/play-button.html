<button
  type="button"
  [attr.title]="title()"
  [class]="klass()"
  [class]="dims() + ' rounded-full bg-[var(--accent)] flex items-center justify-center text-black opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-200 cyan-glow'"
  (click)="onClick($event)"
>
  <span class="material-symbols-outlined fill">{{ icon() }}</span>
</button>
