@if (service.menu(); as target) {
  <div class="fixed inset-0 z-[78]" (click)="service.closeMenu()" aria-hidden="true"></div>
  <div
    role="menu"
    class="fixed z-[80] w-56 max-w-[calc(100vw-2rem)] rounded-xl bg-white dark:bg-[#181818] border border-slate-200 dark:border-white/16 shadow-2xl py-1.5 text-[14px] leading-[20px]"
    [style.left.px]="target.x"
    [style.top.px]="target.y"
  >
    <div class="px-3.5 py-2 border-b border-slate-200 dark:border-white/[0.08] flex items-center gap-2.5">
      <img class="w-8 h-8 rounded object-cover flex-shrink-0" [src]="coverFor(target.track)" [alt]="target.track.title" (error)="onImgError($event)" />
      <div class="truncate min-w-0">
        <p class="text-[13px] font-semibold text-slate-900 dark:text-white truncate">{{ target.track.title }}</p>
        <p class="text-[11px] text-slate-500 dark:text-[#b3b3b3] truncate">{{ target.track.artist }}</p>
      </div>
    </div>
    <button type="button" (click)="service.openAssign()"
      class="w-full text-left px-3.5 py-2.5 flex items-center gap-3 text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-[#242424] hover:text-[var(--accent-ink)] dark:hover:text-[var(--accent)] transition-colors group">
      <span class="material-symbols-outlined text-lg text-[var(--accent-ink)] dark:text-[var(--accent)] group-hover:scale-110 transition-transform">playlist_add</span>
      <span class="font-medium text-[13px]">{{ 'trackMenu.addToPlaylist' | translate }}</span>
    </button>
    <button type="button" (click)="service.queueTrack(target.track)"
      class="w-full text-left px-3.5 py-2 flex items-center gap-3 text-slate-600 dark:text-[#b3b3b3] hover:bg-slate-100 dark:hover:bg-[#242424] hover:text-slate-900 dark:hover:text-white transition-colors">
      <span class="material-symbols-outlined text-lg text-slate-400 dark:text-[#6a6a6a]">queue_music</span>
      <span class="text-[13px]">{{ 'trackMenu.addToQueue' | translate }}</span>
    </button>
  </div>
}
