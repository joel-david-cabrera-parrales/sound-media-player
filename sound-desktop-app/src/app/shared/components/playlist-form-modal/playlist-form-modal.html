<div
  role="dialog"
  aria-modal="true"
  (click)="close()"
  (keydown.escape)="close()"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md select-none"
>
  <div
    role="document"
    (click)="$event.stopPropagation()"
    class="relative w-full max-w-lg bg-white dark:bg-[#181818] border border-slate-200 dark:border-white/16 rounded-2xl p-6 shadow-2xl flex flex-col gap-6"
  >
    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[var(--accent-ink)] dark:text-[var(--accent)] text-[24px] fill">queue_music</span>
          <h2 class="text-[20px] leading-[26px] font-bold text-slate-900 dark:text-white tracking-tight">
            {{ isEdit ? ('playlists.modal.editTitle' | translate) : ('playlists.modal.createTitle' | translate) }}
          </h2>
        </div>
        <p class="text-[12px] leading-[16px] text-slate-500 dark:text-[#b3b3b3]">
          {{ 'playlists.modal.subtitle' | translate }}
        </p>
      </div>
      <button type="button" (click)="close()" [title]="'playlists.modal.close' | translate"
        class="p-1.5 rounded-full text-slate-400 dark:text-[#6a6a6a] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-colors flex-shrink-0">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <div class="flex gap-4 items-start">
      <button type="button" (click)="pickCover()"
        class="relative w-24 h-24 rounded-xl bg-slate-100 dark:bg-[#242424] border border-dashed border-slate-300 dark:border-white/16 hover:border-[color-mix(in_srgb,var(--accent)_60%,transparent)] overflow-hidden flex flex-col items-center justify-center text-slate-400 dark:text-[#6a6a6a] hover:text-[var(--accent-ink)] dark:hover:text-[var(--accent)] transition-all flex-shrink-0 group">
        <img class="absolute inset-0 w-full h-full object-cover" [src]="coverPreview()" alt="" (error)="onCoverError($event)" />
        <span class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[24px] text-white">add_photo_alternate</span>
          <span class="text-[10px] font-medium tracking-wide uppercase text-white">{{ 'playlists.modal.cover' | translate }}</span>
        </span>
      </button>
      <input #coverInput type="file" accept="image/*" class="hidden" (change)="onCoverPicked($event)" />
      <div class="flex-1 flex flex-col gap-3 min-w-0">
        <div>
          <label for="playlist-name" class="block text-[12px] leading-[16px] font-semibold text-slate-600 dark:text-[#b3b3b3] mb-1.5">
            {{ 'playlists.modal.nameLabel' | translate }}
          </label>
          <input
            id="playlist-name"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            type="text"
            maxlength="80"
            [placeholder]="'playlists.modal.namePlaceholder' | translate"
            class="w-full h-11 px-4 bg-slate-50 dark:bg-[#0e0e0e] border border-slate-300 dark:border-white/16 rounded-xl text-[14px] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#6a6a6a] focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all"
          />
          @if (touched() && !valid) {
            <p class="mt-1.5 text-[12px] text-red-600 dark:text-red-400">{{ 'playlists.modal.nameError' | translate }}</p>
          }
        </div>
        <div>
          <label for="playlist-desc" class="block text-[12px] leading-[16px] font-semibold text-slate-600 dark:text-[#b3b3b3] mb-1.5">
            {{ 'playlists.modal.descLabel' | translate }}
          </label>
          <textarea
            id="playlist-desc"
            [value]="description()"
            (input)="description.set($any($event.target).value)"
            rows="2"
            maxlength="280"
            [placeholder]="'playlists.modal.descPlaceholder' | translate"
            class="w-full px-4 py-2.5 bg-slate-50 dark:bg-[#0e0e0e] border border-slate-300 dark:border-white/16 rounded-xl text-[14px] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#6a6a6a] focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all resize-none"
          ></textarea>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3">
      <button type="button" (click)="close()"
        class="px-5 py-2.5 rounded-full text-[13px] font-semibold text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-all">
        {{ 'playlists.modal.cancel' | translate }}
      </button>
      <button type="button" (click)="save()" [disabled]="!valid"
        class="px-5 py-2.5 rounded-full bg-[var(--accent)] text-[#001f28] text-[13px] font-bold hover:bg-[color-mix(in_srgb,var(--accent)_85%,black)] dark:hover:bg-[color-mix(in_srgb,var(--accent)_80%,white)] transition-all active:scale-95 disabled:opacity-50">
        {{ isEdit ? ('playlists.modal.save' | translate) : ('playlists.modal.create' | translate) }}
      </button>
    </div>
  </div>
</div>
