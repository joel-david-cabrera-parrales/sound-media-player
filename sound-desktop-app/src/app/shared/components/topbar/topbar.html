<header class="h-16 flex-shrink-0 bg-white/85 dark:bg-[#121212]/85 backdrop-blur-xl border-b border-slate-200 dark:border-white/[0.08] px-4 md:px-6 flex items-center justify-between gap-3 md:gap-4 z-20">
  <!-- Left: Hamburger (mobile) + Search Box & Categorical Pills -->
  <div class="flex items-center gap-3 md:gap-4 flex-1 min-w-0 max-w-2xl">
    <!-- Hamburger: opens sidebar drawer on mobile -->
    <button
      type="button"
      (click)="toggleSidebar()"
      aria-label="{{ 'shell.topbar.openMenu' | translate }}"
      class="md:hidden w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-colors flex-shrink-0"
    >
      <span class="material-symbols-outlined text-[22px]">menu</span>
    </button>
    <!-- Search Input: 'Buscar en archivos locales...' -->
    <div class="relative flex-1 min-w-0 max-w-md">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-[#6a6a6a]">
        <span class="material-symbols-outlined text-[18px]">search</span>
      </div>
      <input
        [(ngModel)]="search"
        class="w-full h-10 pl-10 pr-10 bg-slate-100 dark:bg-[#181818] hover:bg-slate-200 dark:hover:bg-[#242424] focus:bg-white dark:focus:bg-[#181818] border border-slate-200 dark:border-white/[0.08] focus:border-[#00d2ff] focus:outline-none focus:ring-1 focus:ring-[#00d2ff] rounded-full text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#6a6a6a] text-[14px] leading-[20px] transition-all duration-200"
        [placeholder]="'shell.topbar.searchPlaceholder' | translate"
        type="text" />
      <button type="button" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 dark:text-[#6a6a6a] hover:text-slate-900 dark:hover:text-white transition-colors" [title]="'shell.topbar.filters' | translate">
        <span class="material-symbols-outlined text-[18px]">tune</span>
      </button>
    </div>
    <!-- Filter Pills: Todo & Carpetas -->
    <div class="hidden sm:flex items-center gap-2 flex-shrink-0">
      <!-- Active Pill: Todo -->
      <button
        type="button"
        (click)="setPill('todo')"
        [class]="activePill === 'todo'
          ? 'bg-[#00d2ff] text-[#001f28] font-bold rounded-full px-4 py-1.5 text-[12px] leading-[16px] dark:shadow-[0_0_12px_rgba(0,210,255,0.35)] transition-all'
          : 'bg-slate-100 dark:bg-[#242424] text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-[#2a2a2a] rounded-full px-4 py-1.5 text-[12px] leading-[16px] transition-colors border border-slate-200 dark:border-white/[0.08]'"
      >
        {{ 'shell.topbar.all' | translate }}
      </button>
      <!-- Inactive Pill: Carpetas -->
      <button
        type="button"
        (click)="setPill('carpetas')"
        [class]="activePill === 'carpetas'
          ? 'bg-[#00d2ff] text-[#001f28] font-bold rounded-full px-4 py-1.5 text-[12px] leading-[16px] dark:shadow-[0_0_12px_rgba(0,210,255,0.35)] transition-all'
          : 'bg-slate-100 dark:bg-[#242424] text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-[#2a2a2a] rounded-full px-4 py-1.5 text-[12px] leading-[16px] transition-colors border border-slate-200 dark:border-white/[0.08]'"
      >
        {{ 'shell.topbar.folders' | translate }}
      </button>
    </div>
  </div>
  <!-- Right Side: Topbar Trailing Actions -->
  <div class="flex items-center gap-2 md:gap-3 flex-shrink-0">
    <!-- Theme Toggle -->
    <button type="button" (click)="toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-colors" [title]="theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
      <span class="material-symbols-outlined text-[20px]">{{ theme() === 'dark' ? 'dark_mode' : 'light_mode' }}</span>
    </button>
    <!-- History Action -->
    <button type="button" class="hidden md:flex w-9 h-9 rounded-full items-center justify-center text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-colors" [title]="'shell.topbar.history' | translate">
      <span class="material-symbols-outlined text-[20px]">history</span>
    </button>
    <!-- Notifications Action with Electric Cyan Badge -->
    <button type="button" class="relative w-9 h-9 rounded-full flex items-center justify-center text-slate-600 dark:text-[#b3b3b3] hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-[#242424] transition-colors" [title]="'shell.topbar.notifications' | translate">
      <span class="material-symbols-outlined text-[20px]">notifications</span>
      <span class="absolute top-2 right-2 w-2 h-2 bg-[#00d2ff] rounded-full ring-2 ring-white dark:ring-[#121212] dark:shadow-[0_0_6px_#00d2ff]"></span>
    </button>
    <!-- User Avatar -->
    <div class="ml-1 pl-2 border-l border-slate-200 dark:border-white/[0.08] flex items-center">
      <button type="button" class="relative w-9 h-9 rounded-full overflow-hidden ring-1 ring-slate-300 dark:ring-white/16 hover:ring-[#00d2ff] transition-all">
        <img class="w-full h-full object-cover" [alt]="'common.photoAlt' | translate" [src]="avatarUrl" (error)="onAvatarError($event)" />
      </button>
    </div>
  </div>
</header>
