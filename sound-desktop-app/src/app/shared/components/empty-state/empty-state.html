<div class="p-10 rounded-2xl border border-dashed border-slate-300 dark:border-white/16 text-center shadow-sm dark:shadow-none">
  <span
    class="material-symbols-outlined text-[48px] text-slate-400 dark:text-[#6a6a6a]"
    [class]="iconClass()"
  >
    {{ icon() }}
  </span>
  @if (title()) {
    <p class="mt-3 text-[20px] leading-[26px] font-bold text-slate-900 dark:text-white">
      {{ title() }}
    </p>
  }
  @if (description()) {
    <p class="mt-1 text-[14px] leading-[20px] text-slate-500 dark:text-[#b3b3b3]">
      {{ description() }}
    </p>
  }
  @if (ctaLabel() && ctaLink()) {
    <a
      [routerLink]="ctaLink()"
      class="inline-block mt-5 px-5 py-2.5 rounded-full bg-[var(--accent)] text-[#001f28] font-bold text-[14px] leading-[18px] hover:bg-[color-mix(in_srgb,var(--accent)_85%,black)] dark:hover:bg-[color-mix(in_srgb,var(--accent)_80%,white)] transition-all active:scale-95"
      [class]="ctaClass()"
    >
      {{ ctaLabel() }}
    </a>
  }
</div>
