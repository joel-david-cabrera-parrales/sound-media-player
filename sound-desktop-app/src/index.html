<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>SoundDesktopApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: sound-photo: filesystem:;">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      var raw = localStorage.getItem('sound.profile');
      var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
      if (theme !== 'light') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
