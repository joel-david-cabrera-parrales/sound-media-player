<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>SoundDesktopApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: sound-photo: sound-cover: filesystem: https:; media-src 'self' data: blob: sound-audio: filesystem: https:;">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      var ACCENTS = {
        cyan: ['#00d2ff', '#0088cc'],
        violet: ['#8b5cf6', '#6d28d9'],
        emerald: ['#10b981', '#047857'],
        fuchsia: ['#ec4899', '#be185d'],
        amber: ['#f59e0b', '#b45309']
      };
      var raw = localStorage.getItem('sound.profile');
      var settings = raw ? (JSON.parse(raw).settings || {}) : {};
      var theme = settings.theme || 'dark';
      var dark = theme === 'dark' || (theme !== 'light' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      var accent = ACCENTS[settings.accent] || ACCENTS.cyan;
      document.documentElement.style.setProperty('--accent', accent[0]);
      document.documentElement.style.setProperty('--accent-deep', accent[1]);
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
